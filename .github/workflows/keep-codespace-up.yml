name: keep-codespace-up

# A watchdog that runs on GitHub's servers for about 5.5 hours and checks the
# public link every 5 minutes. When the link is down it starts the codespace if
# the idle timeout shut it down, waits for SARAL (the codespace starts it on boot),
# and sets port 8000 public again. Scheduled runs are often delayed, so each run
# covers the gap until the next one.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-codespace-up
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
      REPO: Venom150204/saral-research-chatbot
    steps:
      - name: Keep the SARAL link up
        run: |
          set -uo pipefail
          name=$(gh api user/codespaces --paginate -q ".codespaces[] | select(.repository.full_name == \"$REPO\" and .display_name != \"saral-autostart-test\") | .name" | head -n 1)
          if [ -z "$name" ]; then echo "No codespace for $REPO"; exit 1; fi
          url="https://${name}-8000.app.github.dev/health"
          public_code() { curl -s -o /dev/null -w '%{http_code}' -m 10 "$url" || true; }

          repair() {
            state=$(gh api "user/codespaces/$name" -q .state)
            echo "codespace $name is $state"
            if [ "$state" = "Shutdown" ] || [ "$state" = "Stopped" ]; then
              gh api -X POST "user/codespaces/$name/start" >/dev/null && echo "start requested"
            fi
            for i in $(seq 1 30); do
              state=$(gh api "user/codespaces/$name" -q .state)
              [ "$state" = "Available" ] && break
              sleep 10
            done
            [ "$state" = "Available" ] || { echo "codespace is $state, not Available"; return 1; }
            for i in $(seq 1 30); do
              code=$(public_code)
              [ "$code" = "200" ] && { echo "public link is up: $url"; return 0; }
              echo "link returned ${code:-no response}; waiting for SARAL and keeping port 8000 public"
              gh codespace ports visibility 8000:public -c "$name" >/dev/null 2>&1 || true
              sleep 15
            done
            echo "public link is still down: $url"
            return 1
          }

          failures=0
          end=$(( $(date +%s) + 330 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            code=$(public_code)
            if [ "$code" = "200" ]; then
              echo "$(date -u +%H:%M) link up"
            else
              echo "$(date -u +%H:%M) link returned ${code:-no response}; repairing"
              if repair; then failures=0; else failures=$((failures + 1)); fi
            fi
            sleep 300
          done
          [ "$failures" -eq 0 ]
