<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
  </defs>
  <rect width="1600" height="930" fill="#ffffff"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#1f2328">SARAL research chatbot</text>
  <text x="40" y="78" font-size="15" fill="#5b6470">Grounded scripts, slides and posts from a research deck or paper, with every claim cited and checked</text>

  <g>
    <rect x="40" y="110" width="300" height="100" rx="12" fill="#f6f7f9" stroke="#c9ced6"/>
    <text x="60" y="145" font-size="18" font-weight="700" fill="#1f2328">Browser</text>
    <text x="60" y="170" font-size="14" fill="#3d444d">Chat interface (React)</text>
    <text x="60" y="192" font-size="13" fill="#5b6470">upload, chat, citations, versions</text>
  </g>

  <g>
    <rect x="40" y="280" width="300" height="380" rx="12" fill="#f6f7f9" stroke="#c9ced6"/>
    <text x="60" y="314" font-size="18" font-weight="700" fill="#1f2328">Ingestion</text>
    <rect x="60" y="334" width="260" height="72" rx="8" fill="#fff" stroke="#c9ced6"/>
    <text x="76" y="362" font-size="14" font-weight="600" fill="#1f2328">Upload</text>
    <text x="76" y="386" font-size="13" fill="#5b6470">.pptx  .pdf  .tex  .md  .txt</text>
    <rect x="60" y="436" width="260" height="100" rx="8" fill="#fff" stroke="#c9ced6"/>
    <text x="76" y="464" font-size="14" font-weight="600" fill="#1f2328">Split into located pieces</text>
    <text x="76" y="487" font-size="13" fill="#5b6470">bullets, notes, page lines,</text>
    <text x="76" y="507" font-size="13" fill="#5b6470">equations whole; each with its</text>
    <text x="76" y="524" font-size="13" fill="#5b6470">slide, page or lines</text>
    <rect x="60" y="558" width="260" height="80" rx="8" fill="#fff" stroke="#c9ced6"/>
    <text x="76" y="586" font-size="14" font-weight="600" fill="#1f2328">Index</text>
    <text x="76" y="609" font-size="13" fill="#5b6470">BM25 + local bge-base-en-v1.5</text>
    <text x="76" y="627" font-size="13" fill="#5b6470">embeddings</text>
    <line x1="190" y1="406" x2="190" y2="434" stroke="#5b6470" stroke-width="1.6" marker-end="url(#a)"/>
    <line x1="190" y1="536" x2="190" y2="556" stroke="#5b6470" stroke-width="1.6" marker-end="url(#a)"/>
  </g>

  <g>
    <rect x="420" y="110" width="760" height="100" rx="12" fill="#f6f7f9" stroke="#c9ced6"/>
    <text x="440" y="145" font-size="18" font-weight="700" fill="#1f2328">FastAPI service</text>
    <text x="440" y="170" font-size="14" fill="#3d444d">REST for uploads and drafts; the agent's reply streamed as server-sent events</text>
    <text x="440" y="192" font-size="13" fill="#5b6470">tokens, tool progress, checked drafts, answer checks</text>
  </g>

  <g>
    <rect x="420" y="250" width="760" height="96" rx="12" fill="#fbf5e6" stroke="#d9b45a" stroke-width="1.5"/>
    <text x="440" y="284" font-size="18" font-weight="700" fill="#1f2328">Agent  (LangChain create_agent on LangGraph)</text>
    <text x="440" y="308" font-size="14" fill="#3d444d">Answers questions from the deck with citations, or calls one of its tools</text>
    <text x="440" y="330" font-size="13" fill="#5b6470">per turn: at most 6 model calls and 5 tool calls; retries, fallback model, summarised memory</text>
  </g>

  <g font-size="14" font-weight="600" fill="#1f2328">
    <rect x="420" y="386" width="140" height="54" rx="8" fill="#fff" stroke="#c9ced6"/>
    <text x="490" y="418" text-anchor="middle" font-family="Consolas, monospace" font-size="13">write_deliverable</text>
    <rect x="575" y="386" width="140" height="54" rx="8" fill="#fff" stroke="#c9ced6"/>
    <text x="645" y="418" text-anchor="middle" font-family="Consolas, monospace" font-size="13">edit_draft</text>
    <rect x="730" y="386" width="140" height="54" rx="8" fill="#fff" stroke="#c9ced6"/>
    <text x="800" y="418" text-anchor="middle" font-family="Consolas, monospace" font-size="13">history</text>
    <rect x="885" y="386" width="140" height="54" rx="8" fill="#fff" stroke="#c9ced6"/>
    <text x="955" y="418" text-anchor="middle" font-family="Consolas, monospace" font-size="13">check_claims</text>
    <rect x="1040" y="386" width="140" height="54" rx="8" fill="#fff" stroke="#c9ced6"/>
    <text x="1110" y="418" text-anchor="middle" font-family="Consolas, monospace" font-size="13">find_in_deck</text>
  </g>

  <g>
    <rect x="420" y="480" width="760" height="180" rx="12" fill="#f6f7f9" stroke="#c9ced6"/>
    <text x="440" y="512" font-size="16" font-weight="700" fill="#1f2328">Write, check, save</text>
    <text x="600" y="512" font-size="13" fill="#5b6470">(write_deliverable; edits use steps 3 to 5 on the changed part)</text>

    <rect x="440" y="532" width="120" height="108" rx="8" fill="#fff" stroke="#c9ced6"/>
    <text x="452" y="556" font-size="14" font-weight="700" fill="#1f2328">1 Evidence</text>
    <text x="452" y="578" font-size="12" fill="#5b6470">whole deck if it</text>
    <text x="452" y="595" font-size="12" fill="#5b6470">fits; else hybrid</text>
    <text x="452" y="612" font-size="12" fill="#5b6470">search + coverage</text>

    <rect x="590" y="532" width="120" height="108" rx="8" fill="#fff" stroke="#c9ced6"/>
    <text x="602" y="556" font-size="14" font-weight="700" fill="#1f2328">2 Writer</text>
    <text x="602" y="578" font-size="12" fill="#5b6470">structured JSON;</text>
    <text x="602" y="595" font-size="12" fill="#5b6470">every claim cites</text>
    <text x="602" y="612" font-size="12" fill="#5b6470">piece ids</text>

    <rect x="740" y="532" width="120" height="108" rx="8" fill="#fff" stroke="#c9ced6"/>
    <text x="752" y="556" font-size="14" font-weight="700" fill="#1f2328">3 Code checks</text>
    <text x="752" y="578" font-size="12" fill="#5b6470">cited pieces exist,</text>
    <text x="752" y="595" font-size="12" fill="#5b6470">figures match,</text>
    <text x="752" y="612" font-size="12" fill="#5b6470">limits measured</text>

    <rect x="890" y="532" width="120" height="108" rx="8" fill="#fff" stroke="#c9ced6"/>
    <text x="902" y="556" font-size="14" font-weight="700" fill="#1f2328">4 Checker</text>
    <text x="902" y="578" font-size="12" fill="#5b6470">separate call sees</text>
    <text x="902" y="595" font-size="12" fill="#5b6470">claim + cited piece,</text>
    <text x="902" y="612" font-size="12" fill="#5b6470">judges support</text>

    <rect x="1040" y="532" width="120" height="108" rx="8" fill="#eef6ef" stroke="#7fb08a"/>
    <text x="1052" y="556" font-size="14" font-weight="700" fill="#1f2328">5 Save or block</text>
    <text x="1052" y="578" font-size="12" fill="#5b6470">one targeted</text>
    <text x="1052" y="595" font-size="12" fill="#5b6470">rewrite; failing</text>
    <text x="1052" y="612" font-size="12" fill="#5b6470">drafts never saved</text>

    <line x1="562" y1="586" x2="588" y2="586" stroke="#5b6470" stroke-width="1.6" marker-end="url(#a)"/>
    <line x1="712" y1="586" x2="738" y2="586" stroke="#5b6470" stroke-width="1.6" marker-end="url(#a)"/>
    <line x1="862" y1="586" x2="888" y2="586" stroke="#5b6470" stroke-width="1.6" marker-end="url(#a)"/>
    <line x1="1012" y1="586" x2="1038" y2="586" stroke="#5b6470" stroke-width="1.6" marker-end="url(#a)"/>
  </g>

  <g>
    <rect x="1240" y="250" width="320" height="190" rx="12" fill="#f6f7f9" stroke="#c9ced6"/>
    <text x="1260" y="284" font-size="18" font-weight="700" fill="#1f2328">Gemini API</text>
    <text x="1260" y="312" font-size="14" fill="#3d444d">agent</text>
    <text x="1260" y="336" font-size="14" fill="#3d444d">writer and editor</text>
    <text x="1260" y="360" font-size="14" fill="#3d444d">checker (separate call,</text>
    <text x="1260" y="380" font-size="14" fill="#3d444d">optionally a different model)</text>
    <text x="1260" y="414" font-size="13" fill="#5b6470">retried with backoff on errors</text>
  </g>

  <g>
    <rect x="40" y="720" width="1520" height="170" rx="12" fill="#f6f7f9" stroke="#c9ced6"/>
    <text x="60" y="756" font-size="18" font-weight="700" fill="#1f2328">PostgreSQL + pgvector</text>
    <text x="270" y="756" font-size="14" fill="#5b6470">(Neon in the hosted demo)</text>
    <g font-size="14" fill="#1f2328" text-anchor="middle">
      <rect x="60" y="780" width="200" height="84" rx="8" fill="#fff" stroke="#c9ced6"/>
      <text x="160" y="818">documents and</text><text x="160" y="838">located pieces</text>
      <rect x="272" y="780" width="200" height="84" rx="8" fill="#fff" stroke="#c9ced6"/>
      <text x="372" y="828">embeddings</text>
      <rect x="484" y="780" width="200" height="84" rx="8" fill="#fff" stroke="#c9ced6"/>
      <text x="584" y="818">drafts and</text><text x="584" y="838">their versions</text>
      <rect x="696" y="780" width="200" height="84" rx="8" fill="#fff" stroke="#c9ced6"/>
      <text x="796" y="818">citations per</text><text x="796" y="838">version</text>
      <rect x="908" y="780" width="200" height="84" rx="8" fill="#fff" stroke="#c9ced6"/>
      <text x="1008" y="818">conversation</text><text x="1008" y="838">events</text>
      <rect x="1120" y="780" width="200" height="84" rx="8" fill="#fff" stroke="#c9ced6"/>
      <text x="1220" y="818">operation ledger</text><text x="1220" y="838">(no double saves)</text>
      <rect x="1332" y="780" width="208" height="84" rx="8" fill="#fff" stroke="#c9ced6"/>
      <text x="1436" y="818">agent memory</text><text x="1436" y="838">(checkpoints)</text>
    </g>
  </g>

  <g stroke="#5b6470" stroke-width="1.6" fill="none">
    <line x1="342" y1="160" x2="418" y2="160" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="190" y1="212" x2="190" y2="278" marker-end="url(#a)"/>
    <line x1="800" y1="212" x2="800" y2="248" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="800" y1="348" x2="800" y2="384" marker-end="url(#a)"/>
    <line x1="490" y1="442" x2="490" y2="478" marker-end="url(#a)"/>
    <line x1="1182" y1="298" x2="1238" y2="298" marker-end="url(#a)"/>
    <path d="M1182,586 H1210 V420 H1238" marker-end="url(#a)"/>
    <line x1="190" y1="662" x2="190" y2="718" marker-end="url(#a)"/>
    <line x1="800" y1="662" x2="800" y2="718" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <g font-size="12" fill="#5b6470">
    <text x="380" y="150" text-anchor="middle">HTTP + SSE</text>
    <text x="200" y="252">upload</text>
    <text x="810" y="700">tools read and save</text>
  </g>
</svg>
